name = "lilcrash-discord-auth"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Just the origin (scheme + host) — NOT the full page URL, no path, no
# trailing slash. This is true even if the site itself lives under a
# subfolder, like a GitHub Pages project site (lilcrash15.github.io/LilcrashLive/):
# the origin is still just https://lilcrash15.github.io.
ALLOWED_RETURN_ORIGIN = "https://lilcrash15.github.io"

# DISCORD_CLIENT_ID and DISCORD_CLIENT_SECRET are secrets, not vars —
# set them with:
#   wrangler secret put DISCORD_CLIENT_ID
#   wrangler secret put DISCORD_CLIENT_SECRET
